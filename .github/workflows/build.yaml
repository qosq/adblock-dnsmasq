name: Build
run-name: build-deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  build-deploy:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Build
        run: bash build.sh deploy/dnsmasq
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
